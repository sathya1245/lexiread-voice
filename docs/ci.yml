# LexiRead CI — parked here on purpose.
#
# GitHub refuses to let an OAuth app (which is what the `gh` CLI is) create
# files under `.github/workflows/`, so this file lives in `docs/` until the
# token carries the `workflow` scope:
#
#     gh auth refresh -h github.com -s workflow
#
# Then enable it with either of these:
#   * `git mv docs/ci.yml .github/workflows/ci.yml` and push, or
#   * GitHub web UI → Add file → Create new file → paste this content at
#     `.github/workflows/ci.yml`.
#
# It runs exactly what `npm test` and `npm run build` run locally, plus a smoke
# test that boots the built server and fetches /api/health.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # --include=dev keeps this working if NODE_ENV is ever set to production
      # in repo-wide variables: npm would otherwise skip devDependencies and
      # `npm run build` would fail with "vite: not found".
      - name: Install dependencies
        run: npm ci --include=dev

      - name: Unit tests (shared + server, including the API/socket integration test)
        run: npm test

      - name: Build the client
        run: npm run build

      - name: Smoke test the built server
        run: |
          node server/src/index.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8787/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/api/health
          curl -fsS http://127.0.0.1:8787/ | grep -q "LexiRead"
          kill $SERVER_PID
        env:
          PORT: 8787
          DATA_DIR: ${{ runner.temp }}/lexiread-data

# Render blueprint — one web service that serves both the API and the client.
# Docs: docs/DEPLOY.md
#
# One-click: https://render.com/deploy?repo=https://github.com/sathya1245/lexiread-voice
#
# This is the ZERO-COST setup: the free instance type, no payment card, no disk.
# Two consequences worth knowing before a demo:
#   1. SQLite lives on ephemeral storage, so profiles, sessions and flagged
#      words reset whenever the instance restarts or you deploy again.
#   2. The instance sleeps after ~15 minutes idle; the first request after that
#      takes ~30-60s while it wakes. Open the URL once before judging starts.
#
# To make progress stick, switch to the paid always-on setup:
#   * `plan: starter`  (or higher)
#   * add back the disk block:
#         disk:
#           name: lexiread-voice-data
#           mountPath: /var/data
#           sizeGB: 1
#   * and point DATA_DIR at the mount:  DATA_DIR: /var/data
services:
  - type: web
    # Render derives the public URL from this name: lexiread-voice.onrender.com
    name: lexiread-voice
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # /tmp is always writable; the app creates this directory on boot
      # (server/src/db.js). Swap to /var/data if you attach a disk.
      - key: DATA_DIR
        value: /tmp/lexiread-data
      - key: OCR_LANGS
        value: eng
      - key: DICTIONARY_TIMEOUT_MS
        value: "6000"
